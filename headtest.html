<!doctype html>
<html><head><meta charset="utf-8"><title>Head test</title>
<style>body{margin:0;background:#6b6458;overflow:hidden}#info{position:fixed;left:8px;top:8px;color:#fff;font:12px sans-serif}</style></head>
<body><div id="info"></div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/examples/jsm/libs/meshopt_decoder.module.js';
const q = new URLSearchParams(location.search);
const file = q.get('f') || '/chars/heads.glb';
const R = new THREE.WebGLRenderer({ antialias: true }); R.setSize(innerWidth, innerHeight); R.setPixelRatio(devicePixelRatio);
R.outputColorSpace = THREE.SRGBColorSpace; R.toneMapping = THREE.ACESFilmicToneMapping; R.toneMappingExposure = 1.1; document.body.appendChild(R.domElement);
const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xfff4e0, 0x404050, 1.4));
const key = new THREE.DirectionalLight(0xffe2c0, 2.4); key.position.set(1, 1.5, 2); scene.add(key);
const rim = new THREE.DirectionalLight(0xa0c0ff, 1.0); rim.position.set(-2, 1, -1); scene.add(rim);
const cam = new THREE.PerspectiveCamera(22, innerWidth / innerHeight, 0.01, 50);
const T = new THREE.TextureLoader(); const tex = (u, srgb = true) => { const t = T.load(u); if (srgb) t.colorSpace = THREE.SRGBColorSpace; t.flipY = false; return t; };
const gltf = await new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).loadAsync(file);
// meshopt quantises vertex data and moves the scale into node transforms: bake it back into plain float geometry
gltf.scene.updateMatrixWorld(true);
gltf.scene.traverse((o) => { if (!o.isMesh) return; const g = new THREE.BufferGeometry();
  for (const k of ['position', 'normal', 'uv']) { const a = o.geometry.attributes[k]; if (!a) continue; const n = a.itemSize, arr = new Float32Array(a.count * n); for (let i = 0; i < a.count; i++) for (let c = 0; c < n; c++) arr[i * n + c] = a.getComponent(i, c); g.setAttribute(k, new THREE.BufferAttribute(arr, n)); }
  if (o.geometry.index) g.setIndex(o.geometry.index.clone()); g.applyMatrix4(o.matrixWorld); if (g.attributes.normal) g.attributes.normal.normalize?.(); g.computeBoundingBox(); o.geometry = g; });
const heads = []; gltf.scene.traverse((o) => { if (o.isMesh && /^head_[mf]_\w+_\d+$/.test(o.name)) heads.push(o); });
const byName = {}; gltf.scene.traverse((o) => { if (o.isMesh) byName[o.name] = o; });
const meta = await fetch(file.replace('.glb', '.json')).then((r) => r.json()).catch(() => ({ variants: {} }));
const skinFor = (sex, age) => `/chars/skin_${age === 'elder' ? 'old' : age === 'adult' ? 'middleage' : 'young'}_asian_${sex === 'f' ? 'female' : 'male'}.jpg`;
const cols = Math.ceil(Math.sqrt(heads.length)); let i = 0;
for (const h of heads) {
  const [, sex, age] = h.name.split('_'); const v = meta.variants[h.name] || {};
  const grp = new THREE.Group(); scene.add(grp);
  h.geometry.computeBoundingBox(); const bb = h.geometry.boundingBox; const c = bb.getCenter(new THREE.Vector3());
  const add = (m, mat) => { if (!m) return; m.material = mat; m.position.set(-c.x, -c.y, -c.z); m.rotation.set(0, 0, 0); m.scale.set(1, 1, 1); grp.add(m); };
  add(h, new THREE.MeshStandardMaterial({ map: tex(skinFor(sex, age)), roughness: 0.62 }));
  add(byName[h.name + '_eyes'], new THREE.MeshStandardMaterial({ map: tex('/chars/eye_brown.png'), roughness: 0.25 }));
  add(byName[h.name + '_brows'], new THREE.MeshStandardMaterial({ map: tex(`/chars/brow_${(v.brows || 'eyebrow001').slice(-3)}.png`), transparent: true, alphaTest: 0.2, depthWrite: false, color: '#2a1a12' }));
  add(byName[h.name + '_lashes'], new THREE.MeshStandardMaterial({ map: tex('/chars/lashes01.png'), transparent: true, alphaTest: 0.2, depthWrite: false, color: '#0e0a08', side: THREE.DoubleSide }));
  grp.position.set((i % cols - (cols - 1) / 2) * 0.3, -(Math.floor(i / cols) - (Math.ceil(heads.length / cols) - 1) / 2) * 0.34, 0); i++;
}
const span = Math.max(cols, Math.ceil(heads.length / cols)) * 0.34;
cam.position.set(0.05 * span, 0.03, span * 2.6 + 0.6); cam.lookAt(0, 0, 0);
document.getElementById('info').textContent = `${heads.length} heads · ${file}`;
let a = 0; R.setAnimationLoop(() => { a += 0.004; for (const g of scene.children) if (g.isGroup) g.rotation.y = Math.sin(a) * 0.5; R.render(scene, cam); });
window.__ready = true; window.__heads = heads; window.__byName = byName; scene.background = new THREE.Color('#6b6458');
</script></body></html>
